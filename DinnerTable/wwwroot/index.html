<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DinnerTable — A little planning. A better week.</title><link rel="stylesheet" href="/app.css"></head>
<body><header><a class="brand" href="/"> <span class="mark">dt.</span> DinnerTable<span class="local">LOCAL EDITION</span></a><nav aria-label="Main navigation"><button class="nav active" data-tab="plan">Weekly plan</button><button class="nav" data-tab="recipes">Recipes</button><button class="nav" data-tab="history">History</button></nav><span class="saved"><i></i> Saved on your device</span></header>
<main><div class="intro"><div><span class="eyebrow">GOOD FOOD. LESS GUESSWORK.</span><h1>A better week starts here.</h1><p>Simple dinners. A thoughtful grocery list. A budget that works.</p></div><div class="date">YOUR DINNER ROUTINE<br><strong id="date"></strong></div></div>
<form id="settings" class="settings"><label>People at the table<div class="input"><span>♧</span><input aria-label="People at the table" id="people" type="number" min="1" max="20" required value="4"><small>people</small></div></label><label>Dinners to plan<div class="input"><span>▦</span><input aria-label="Dinners to plan" id="nights" type="number" min="1" max="7" required value="5"><small>nights</small></div></label><label>Weekly dinner budget<div class="input"><span>$</span><input aria-label="Weekly dinner budget" id="budget" type="number" min="1" max="2000" step="0.01" required value="75"></div></label><button class="primary" type="submit" id="generate">✦ &nbsp; Build my dinner plan</button></form>
<div id="error" role="alert" hidden></div><section id="view"></section><footer><span>DinnerTable · Made for everyday life.</span><span>Local storage. No subscriptions. Your table, your rules.</span></footer></main>
<dialog id="detail"><button class="close" aria-label="Close recipe">×</button><div id="detailBody"></div></dialog><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
